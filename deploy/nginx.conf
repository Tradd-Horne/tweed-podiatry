# Tweed Heads Podiatry — static site
# TLS is terminated by Traefik in front of this; nginx serves plain HTTP inside the
# Docker network. Modelled on the Rising Damp Brisbane config, which is the pattern that
# already works on this droplet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    charset utf-8;

    # Traefik terminates TLS, so nginx sees plain http and would build absolute redirects
    # as http:// — an extra hop before Traefik bumps it back. Relative Location headers keep
    # the browser on https and make it a single redirect.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Next's static export writes flat files: /cost.html, /areas/tweed-heads.html. Serve the
    # pretty URL from the flat file so the links in the HTML resolve without a redirect.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Build assets are content-hashed by Next, so they can be cached hard and forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
